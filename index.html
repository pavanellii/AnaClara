<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para a Ana ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA DE CARREGAMENTO -->

    <div id="loading">

        <h1>Inicializando sistema...</h1>

        <div id="barra">
            <div id="progresso"></div>
        </div>

        <p id="texto">0%</p>

    </div>


    <!-- CONTEÚDO PRINCIPAL -->

    <div id="conteudo">

        <h1 id="titulo">
            Uma coisinha para você...
        </h1>

        <p id="mensagem"></p>


        <!-- PERGUNTA -->

        <div id="pergunta">

            <img
                src="foto.jpg"
                id="foto"
                alt="Ana"
            >

            <h2>
                Ana, vamos continuar se falando e se conhecendo? ❤️
            </h2>

            <div class="botoes">

                <button id="sim">
                    SIM ❤️
                </button>

                <button id="nao">
                    Não, te odeio
                </button>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
